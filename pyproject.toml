[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usb-bouncer"
version = "0.4.0"
description = "macOS tool that vets unknown USB devices for BadUSB red flags and keystroke injection"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = ["pyyaml>=6", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.17.5", "pyright>=1.1.400"]
hid = ["pyobjc-framework-Quartz>=10"]

[project.scripts]
usb-bouncer = "usb_bouncer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/usb_bouncer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["src", "tests"]
extraPaths = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
