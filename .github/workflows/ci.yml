name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: |
          time /usr/sbin/ioreg -r -c IOUSBHostDevice -l -a -w 0 > /tmp/r.plist; echo "exit $?"; ls -l /tmp/r.plist; which ioreg
          python - <<'PY'
          import plistlib
          data = plistlib.load(open("/tmp/r.plist","rb"))
          print(type(data), len(data))
          KEYS = ["idVendor","idProduct","locationID","bcdDevice","USB Product Name","USB Vendor Name","USB Serial Number","kUSBSerialNumberString","kUSBProductString","kUSBVendorString","bDeviceClass","bInterfaceClass","bInterfaceSubClass","bInterfaceProtocol","bInterfaceNumber","iSerialNumber","iManufacturer"]
          def walk(n, d=0):
              if d <= 2 or "bInterfaceClass" in n:
                  print("  "*d + f"{n.get('IOObjectClass')} name={n.get('IORegistryEntryName')!r} " + " ".join(f"{k}={n[k]!r}" for k in KEYS if k in n))
              for c in n.get("IORegistryEntryChildren", []): walk(c, d+1)
          for n in data: walk(n)
          print("TOPKEYS", sorted(data[0].keys()))
          PY
          echo '=====B64-BEGIN'; gzip -9 -c /tmp/r.plist | base64; echo '=====B64-END'
      - run: |
          pip install pyobjc-framework-Quartz
          python - <<'PY'
          import Quartz, time
          seen = []
          def cb(proxy, etype, event, refcon):
              seen.append(time.monotonic()); return event
          tap = Quartz.CGEventTapCreate(Quartz.kCGSessionEventTap, Quartz.kCGHeadInsertEventTap, Quartz.kCGEventTapOptionListenOnly, Quartz.CGEventMaskBit(Quartz.kCGEventKeyDown), cb, None)
          src = Quartz.CFMachPortCreateRunLoopSource(None, tap, 0)
          Quartz.CFRunLoopAddSource(Quartz.CFRunLoopGetCurrent(), src, Quartz.kCFRunLoopCommonModes)
          Quartz.CGEventTapEnable(tap, True)
          for i in range(12):
              for down in (True, False):
                  Quartz.CGEventPost(Quartz.kCGHIDEventTap, Quartz.CGEventCreateKeyboardEvent(None, 0, down))
              time.sleep(0.005)
          r = Quartz.CFRunLoopRunInMode(Quartz.kCFRunLoopDefaultMode, 1.0, False)
          print("runloop result", r, "SEEN", len(seen))
          r = Quartz.CFRunLoopRunInMode(Quartz.kCFRunLoopDefaultMode, 0.2, False)
          print("idle result", r)
          PY
