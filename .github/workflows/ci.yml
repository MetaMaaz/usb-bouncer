name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest --cov=usb_bouncer --cov-report=term-missing --cov-report=xml
      - name: Coverage summary
        if: matrix.python-version == '3.11'
        run: |
          echo "### Coverage (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          coverage report >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  static:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: pyright

  ci-ok:
    if: always()
    needs: [test, static]
    runs-on: ubuntu-latest
    steps:
      - name: Verify upstream jobs
        run: |
          [ "${{ needs.test.result }}" = "success" ] || exit 1
          [ "${{ needs.static.result }}" = "success" ] || exit 1
