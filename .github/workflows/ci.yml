name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,hid]"
      - name: DEBUG tap timestamps
        run: |
          python - <<'PY'
          import Quartz as q, time
          rows = []
          def cb(proxy, etype, event, refcon):
              rows.append((etype, q.CGEventGetTimestamp(event), q.CGEventGetIntegerValueField(event, q.kCGKeyboardEventAutorepeat), time.monotonic()))
              return event
          tap = q.CGEventTapCreate(q.kCGSessionEventTap, q.kCGHeadInsertEventTap, q.kCGEventTapOptionListenOnly, q.CGEventMaskBit(q.kCGEventKeyDown), cb, None)
          src = q.CFMachPortCreateRunLoopSource(None, tap, 0)
          q.CFRunLoopAddSource(q.CFRunLoopGetCurrent(), src, q.kCFRunLoopCommonModes)
          q.CGEventTapEnable(tap, True)
          for gap in (0.08, 0.005):
              t0 = time.monotonic()
              for i in range(12):
                  for down in (True, False):
                      q.CGEventPost(q.kCGHIDEventTap, q.CGEventCreateKeyboardEvent(None, 0, down))
                  time.sleep(gap)
              print("posted in", time.monotonic() - t0)
              q.CFRunLoopRunInMode(q.kCFRunLoopDefaultMode, 0.5, False)
              print("DBG gap", gap, "n", len(rows))
              for r in rows: print("DBG", r)
              rows.clear()
          PY
      - name: Test
        run: pytest --cov=usb_bouncer --cov-report=term-missing --cov-report=xml
      - name: Smoke test the installed command
        run: |
          usb-bouncer list
          usb-bouncer scan --no-log
          usb-bouncer watch --hid --polls 2 --no-log
      - name: Coverage summary
        if: matrix.python-version == '3.11'
        run: |
          echo "### Coverage (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          coverage report >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  static:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev,hid]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: pyright

  ci-ok:
    if: always()
    needs: [test, static]
    runs-on: ubuntu-latest
    steps:
      - name: Verify upstream jobs
        run: |
          [ "${{ needs.test.result }}" = "success" ] || exit 1
          [ "${{ needs.static.result }}" = "success" ] || exit 1
