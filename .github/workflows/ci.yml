name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: sw_vers
      - run: ioreg -p IOUSB -l -w 0
      - run: echo '=====PLIST-BEGIN'; ioreg -p IOUSB -a -l -w 0; echo '=====PLIST-END'
      - run: echo '=====R-BEGIN'; ioreg -r -c IOUSBHostDevice -l -a -w 0 | head -c 60000; echo '=====R-END'
      - run: pip download --no-deps -d /tmp/x pyobjc-framework-IOKit || echo NO-IOKIT-PKG
      - run: |
          pip install pyobjc-framework-Quartz
          python - <<'PY'
          import Quartz, platform
          print(platform.mac_ver())
          def cb(proxy, etype, event, refcon): return event
          tap = Quartz.CGEventTapCreate(Quartz.kCGSessionEventTap, Quartz.kCGHeadInsertEventTap, Quartz.kCGEventTapOptionListenOnly, Quartz.CGEventMaskBit(Quartz.kCGEventKeyDown), cb, None)
          print("TAP:", tap)
          print("has RunInMode:", hasattr(Quartz, "CFRunLoopRunInMode"))
          PY
      - run: osascript -e 'display notification "x" with title "y"'; echo "osascript exit $?"
